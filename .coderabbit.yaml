# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: >-
  Write short comments and summaries in English.
  Keep identifiers and labels as they are.
  Describe concrete defects, consequences and fixes.
  Avoid repetition, praise and cosmetic suggestions.

# Central base. Do not inherit older settings from the UI.
inheritance: false
early_access: false
enable_free_tier: true

reviews:
  profile: quiet

  auto_approvals:
    enabled: false

  # Short summary in the PR description.
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_instructions: |
    Write a short summary in English.
    Describe the main change and its practical consequence.
    Include breaking changes, migrations and operational requirements when present.
    Do not claim that tests were run without verified evidence.
    Do not repeat the title or list every changed file.

  # Title generation is triggered by the placeholder in the PR title.
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: |
    Write a short PR title in English following Conventional Commits.
    Use type: description or type(scope): description.
    Allowed types are feat, fix, docs, refactor, perf, test,
    build, ci, chore, style and revert.
    Use feat for new functionality and fix for bug fixes.
    Use chore(deps) for routine dependency updates.
    Use fix with a relevant scope for security fixes.
    Do not use deps or security as standalone types.
    Describe the main change with an imperative verb.
    Aim for fewer than 72 characters without losing key information.
    Use a scope only when it adds information.
    Do not add unverified effects or issue references.
    Do not end the title with a period.

  # Limit status messages and presentation noise.
  review_status: false
  review_info: false
  review_details: false
  review_progress: false
  commit_status: false
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false

  suggested_reviewers: false
  auto_assign_reviewers: false
  abort_on_close: true

  # Flags low-quality AI-generated PRs with a Walkthrough warning and the slop label.
  # include_all_authors also covers same-repo branches, where agents open their PRs.
  slop_detection:
    enabled: true
    include_all_authors: true
    label: "slop"

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches: []
    labels: ["!wip"]
    ignore_usernames: []
    ignore_title_keywords: []

  # Review all other files without a repo-specific include list.
  path_filters:
    - "!**/docs/**"
    - "!**/doc/**"
    - "!**/*.md"
    - "!**/*.mdx"
    - "!**/*.rst"
    - "!**/*.adoc"

  path_instructions:
    - path: "**/*"
      instructions: |
        Report concrete defects with a clear consequence:
        security flaws, incorrect behavior, data loss,
        broken builds or deployments, and significant
        performance or cost problems.
        Check existing safeguards and relevant callers.
        Describe a specific failure scenario.
        Separate confirmed defects from missing verification.
        Do not repeat the same root cause in several comments.
        Skip cosmetic suggestions, naming preferences
        and general refactoring suggestions.
        Ask for tests when a concrete changed risk needs coverage.
        Never weaken tests, permissions or merge controls.
        Flag leaked secrets without repeating the secret values.

    - path: ".github/**"
      instructions: |
        Prioritize token permissions, secrets and execution
        of untrusted PR code.
        Do not require custom CodeQL workflows when default setup is used.
        Do not require ci.yaml, dependabot.yaml or language files
        just because they are missing.
        Assess existing safeguards and the change's concrete risks.

  # Shared label list. Make sure the labels exist in every repo.
  suggested_labels: true
  auto_apply_labels: true
  labeling_instructions:
    - label: fix
      instructions: "The main change fixes a concrete defect."

    - label: feature
      instructions: "The main change adds a new capability."

    - label: enhancement
      instructions: "Improves existing functionality without mainly fixing a defect."

    - label: chore
      instructions: "Routine maintenance not mainly about dependencies or documentation."

    - label: documentation
      instructions: "The main purpose is documentation or user help."

    - label: dependencies
      instructions: "Changes project dependencies, runtime versions or container base images."

    - label: security
      instructions: >-
        Changes a security control or fixes a documented security risk.
        A routine dependency update is not enough.

    - label: accessibility
      instructions: "Fixes a concrete accessibility barrier in the user interface."

    # Review state. CodeRabbit can only add labels, never remove them, so whoever
    # fixes the findings removes a state label that no longer applies.
    - label: review-ready
      instructions: >-
        The latest review found no actionable defects and no open
        review threads remain. Do not apply it while needs-rework or
        rewrite-recommended is on the PR.

    - label: needs-rework
      instructions: >-
        The latest review found defects that must be fixed before merge,
        but the approach itself is sound.

    - label: rewrite-recommended
      instructions: >-
        The approach is fundamentally flawed, for example wrong layer,
        unsafe design or repeated patching of the same root cause,
        so rewriting is safer than fixing it further.

  # Advisory checks.
  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        Follow Conventional Commits with the type feat, fix, docs,
        refactor, perf, test, build, ci, chore, style or revert.
        Use type: description or type(scope): description.
        Write the description in English and state the main change correctly.
        Accept an existing title that meets these requirements.
    description:
      mode: warning
    docstrings:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks: []

  # Disable code generation and agent-based add-ons.
  finishing_touches:
    docstrings: {enabled: false}
    unit_tests: {enabled: false}
    simplify: {enabled: false}
    autofix: {enabled: false}
    fix_ci: {enabled: false}
    resolve_merge_conflict: {enabled: false}
    custom: []

  post_merge_actions: []

  tools:
    # Keep checks that CodeQL does not replace.
    actionlint: {enabled: true}
    shellcheck: {enabled: true}

    # Avoid extra comments about other GitHub checks.
    github-checks: {enabled: false}

    # Limit overlapping lint and style comments.
    biome: {enabled: false}
    eslint: {enabled: false}
    oxc: {enabled: false}
    markdownlint: {enabled: false}
    languagetool: {enabled: false}
    vale: {enabled: false}
    yamllint: {enabled: false}
    stylelint: {enabled: false}
    htmlhint: {enabled: false}
    sqlfluff: {enabled: false}
    squawk: {enabled: false}

    # Keep security analysis for relevant files.
    gitleaks: {enabled: true}
    trufflehog: {enabled: true}
    osvScanner: {enabled: true}
    trivy: {enabled: true}
    zizmor: {enabled: true}

chat:
  art: false
  auto_reply: false
  integrations:
    jira: {usage: disabled}
    linear: {usage: disabled}

knowledge_base:
  # Use explicit path_instructions instead of old rule files.
  code_guidelines:
    enabled: false

  web_search:
    enabled: true

  learnings: {scope: local}
  issues: {scope: local}
  pull_requests: {scope: local}

  jira: {usage: disabled}
  linear: {usage: disabled}
  mcp: {usage: disabled}

  automatic_linking_mode: disabled
  linked_repositories: []

issue_enrichment:
  auto_enrich:
    enabled: false

  planning:
    enabled: false
    auto_planning:
      enabled: false

  labeling:
    auto_apply_labels: true
    labeling_instructions:
      - label: bug
        instructions: "Concrete defects, crashes or regressions."

      - label: feature
        instructions: "Request for a new capability."

      - label: enhancement
        instructions: "Improvement of existing functionality, not a bug report."

      - label: chore
        instructions: "Routine maintenance not mainly about dependencies or documentation."

      - label: dependencies
        instructions: "The issue concerns a project dependency or runtime version."

      - label: documentation
        instructions: "The issue concerns documentation or user instructions."

      - label: security
        instructions: "A concretely described security risk. Do not repeat secrets."

      - label: accessibility
        instructions: "A concrete accessibility barrier in the user interface."

      - label: question
        instructions: "The issue mainly asks for information, not a code change."
